[build-system]
requires = ["setuptools>=69","wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "us-electoral-observatory"
version = "0.1.0"
description = "Reproducible US election data engineering and statistics"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1,<2","fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","pandas>=2.2,<4","pyarrow>=17,<25","httpx>=0.27,<1","pydantic>=2.9,<3","typer>=0.12,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<9","pytest-cov>=5,<7","ruff>=0.7,<1"]
[project.scripts]
electoral = "electoral.cli:app"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E701", "E702"]
