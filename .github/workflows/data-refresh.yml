name: Refresh electoral datasets
on:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"
  push:
    branches: [main]
    paths:
      - "scripts/ingest_mit_countypres.py"
      - ".github/workflows/data-refresh.yml"
permissions:
  contents: write
  actions: read
concurrency:
  group: electoral-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install "pandas>=2.2,<4" "pyarrow>=17,<25" "httpx>=0.27,<1"
      - name: Download, verify, normalize and build time series
        run: python scripts/ingest_mit_countypres.py
      - name: Validate generated artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("apps/web/data/presidential-timeseries.json")
          data = json.loads(p.read_text())
          assert data["metadata"]["rows_silver"] > 0
          assert len(data["national"]) > 0
          assert len(data["metadata"]["years"]) >= 6
          print("Validated", data["metadata"]["rows_silver"], "rows")
          PY
      - name: Preserve Raw, Bronze, Silver and manifest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electoral-data-${{ github.run_id }}
          path: |
            data/raw/mit_election_lab.county_president/**
            data/bronze/mit_county_president_2000_2024.parquet
            data/silver/mit_county_president_2000_2024.parquet
            data/silver/mit_county_president_2000_2024.manifest.json
          retention-days: 90
          if-no-files-found: error
      - name: Commit refreshed public dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/data/presidential-timeseries.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh MIT presidential county time series"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "No dashboard data changes."
          fi
