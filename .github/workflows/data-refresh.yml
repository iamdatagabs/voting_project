name: Refresh electoral datasets
on:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"
  push:
    branches: [main]
    paths:
      - "scripts/ingest_mit_countypres.py"
      - "scripts/ingest_mit_house.py"
      - "scripts/ingest_mit_senate.py"
      - ".github/workflows/data-refresh.yml"
permissions:
  contents: write
  actions: read
concurrency:
  group: electoral-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install "pandas>=2.2,<4" "pyarrow>=17,<25" "httpx>=0.27,<1" "pydantic>=2.8,<3"
      - name: Download and validate presidential returns
        run: python scripts/ingest_mit_countypres.py
      - name: Download and validate House district returns
        run: PYTHONPATH=src python scripts/ingest_mit_house.py
      - name: Download and validate Senate statewide returns
        run: PYTHONPATH=src python scripts/ingest_mit_senate.py
      - name: Validate generated public datasets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          president = json.loads(Path("apps/web/data/presidential-timeseries.json").read_text())
          house = json.loads(Path("apps/web/data/house-timeseries.json").read_text())
          senate = json.loads(Path("apps/web/data/senate-timeseries.json").read_text())
          assert president["metadata"]["rows_silver"] > 0
          assert len(president["national"]) > 0
          assert house["metadata"]["silver_rows"] > 0
          assert len(house["states"]) > 0
          assert house["metadata"]["source_validation"] == "pass"
          assert senate["metadata"]["silver_rows"] > 0
          assert len(senate["states"]) > 0
          assert senate["metadata"]["source_validation"] == "pass"
          print("President:", president["metadata"]["rows_silver"], "rows")
          print("House:", house["metadata"]["silver_rows"], "rows;", house["metadata"]["contests"], "contests")
          print("Senate:", senate["metadata"]["silver_rows"], "rows;", senate["metadata"]["contests"], "contests")
          PY
      - name: Preserve Raw, Bronze, Silver and manifests
        uses: actions/upload-artifact@v4
        with:
          name: electoral-data-${{ github.run_id }}
          path: |
            data/raw/**
            data/bronze/**
            data/silver/**
          retention-days: 90
          if-no-files-found: error
      - name: Commit refreshed public dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --mixed origin/main
          git add apps/web/data/presidential-timeseries.json apps/web/data/house-timeseries.json apps/web/data/senate-timeseries.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh MIT election time series"
            git push origin HEAD:main
          else
            echo "No dashboard data changes."
          fi
